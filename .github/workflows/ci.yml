name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agente:
    name: Agente (Reto 1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - name: Dependencias ligeras
        # Las pruebas usan dobles del LLM y del recuperador: no hace falta torch ni FAISS.
        run: pip install fastapi "uvicorn[standard]" pydantic pydantic-settings langgraph boto3 pyyaml pytest httpx ruff bandit
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Bandit
        run: bandit -q -r app etapa1
      - name: Pruebas
        run: pytest -q

  tablero-api:
    name: API del tablero (Reto 2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/api/requirements.txt
      - name: Dependencias
        run: pip install -r requirements.txt pytest ruff bandit
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Bandit
        run: bandit -q -r app
      - name: Pruebas
        # `dashboard.db` está versionado, así que las pruebas corren contra la base real.
        # `metadata.jsonl` (1,4 GB) no lo está: se apunta a una ruta inexistente y la
        # única prueba que necesita el texto original se salta sola.
        env:
          METADATA_PATH: /no/existe/metadata.jsonl
        run: pytest -q

  datos:
    name: Datos del tablero
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/datos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        # Solo análisis estático: `preparar.py` y sus pruebas necesitan el corpus
        # original de ADL, que no está en el repositorio.
        run: pip install ruff && ruff check . && ruff format --check .

  web:
    name: Frontends (eslint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paquete: [frontagent, dashboard/web]
    defaults:
      run:
        working-directory: ${{ matrix.paquete }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.paquete }}/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: ESLint
        run: npm run lint
