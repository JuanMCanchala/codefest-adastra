name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agente:
    name: Agente (Reto 1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - name: Dependencias ligeras
        # Las pruebas usan dobles del LLM y del recuperador: no hace falta torch ni FAISS.
        run: pip install fastapi "uvicorn[standard]" pydantic pydantic-settings langgraph boto3 pyyaml pytest httpx ruff bandit
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Bandit
        run: bandit -q -r app etapa1
      - name: Pruebas
        run: pytest -q
