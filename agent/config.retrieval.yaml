# Configuracion de recuperacion para la Etapa 2.
#
# Parte de la configuracion medida en la Etapa 1 (config.adl.yaml), con dos cambios
# por eficiencia: la latencia puntua en el Bloque B (seccion 2.5.2) y el contenedor de
# Coolify corre en CPU.
#   - reranker ligero y 40 candidatos: el cross-encoder en CPU era el paso mas lento.
#   - graph.fuse_into_retrieval se activa por variable de entorno (GRAFO_EN_RECUPERACION)
#     tras medir su costo en latencia y memoria (carga GLiNER).

encoders:
  - name: "bge-m3"
    model_id: "BAAI/bge-m3"
    weight: 1.0
    normalize: true
    use_dense: true
    use_sparse: true
    use_colbert: false

chunking:
  output_max_words: 250

retrieval:
  top_k_faiss: 100
  fusion: "rrf"
  rrf_k: 60
  final_fragments: 10
  final_documents: 3
  min_fragment_words: 20
  doc_dedup_threshold: 0.90

rerank:
  enabled: true
  # bge-reranker-v2-m3 (568M) tardaba 22-26 s por pregunta en el contenedor CPU; este
  # cross-encoder multilingue (12 capas x 384) procesa 30 pares en 1,2 s y queda a 1-1,5
  # puntos de nDCG en MKQA segun su model card (docs/investigacion/03_arquitectura/
  # reranking_y_seguridad.md).
  model_id: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
  max_length: 512
  top_k_candidates: 40

aggregation:
  method: "max_pool"
  k_chunks: 30

graph:
  enabled: true
  ner_model: "urchade/gliner_multi-v2.1"
  entity_types: ["persona", "organizacion", "pais", "tecnologia", "evento", "lugar"]
  fuse_into_retrieval: false
  fusion_weight: 0.3
